# nfpm configuration for BuildUI Linux packaging (deb and rpm)
name: "buildui"
arch: "${ARCH}"
platform: "linux"
version: "${CLEAN_VERSION}"
section: "devel"
priority: "optional"
maintainer: "BuildUI Team <support@buildui.local>"
description: "Blot-UI - AI App Builder Desktop Application"
vendor: "BuildUI"
homepage: "https://github.com/blue-idea/BuildUI"
license: "MIT"

contents:
  - src: "build/bin/buildui"
    dst: "/usr/bin/buildui"
    file_info:
      mode: 0755
  - src: "build/linux/buildui.desktop"
    dst: "/usr/share/applications/buildui.desktop"
    file_info:
      mode: 0644
  - src: "build/appicon.png"
    dst: "/usr/share/pixmaps/buildui.png"
    file_info:
      mode: 0644
  - src: "build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/buildui.png"
    file_info:
      mode: 0644

depends:
  - xdg-utils

overrides:
  deb:
    depends:
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
      - xdg-utils

  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - xdg-utils
